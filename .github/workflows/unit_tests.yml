name: CPython 3.14t acceptance

on:
  pull_request:
  push:
    branches: [main, polars-2.0]
  workflow_dispatch:

jobs:
  free-threaded:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.10.6"
      - name: Install interpreter and locked local wheel
        run: uv sync --frozen --python 3.14.2t --group dev
      - name: Verify default import and frame operations
        run: env -u PYTHON_GIL uv run --frozen python -W error::RuntimeWarning -m pytest -q
      - name: Verify recorded wheel digest
        run: |
          uv run --frozen python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest = json.loads(Path('wheels/build-manifest.json').read_text())
          for wheel in manifest['wheels']:
              path = Path('wheels') / Path(wheel['path']).name
              assert hashlib.sha256(path.read_bytes()).hexdigest() == wheel['sha256']
          PY
